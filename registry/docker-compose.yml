services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prompt_trace
      POSTGRES_USER: prompt_trace_admin
      POSTGRES_PASSWORD: ${PROMPT_TRACE_DB_PASSWORD:?Set PROMPT_TRACE_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - prompt_trace_postgres:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
      - ./verify.sql:/verify.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompt_trace_admin -d prompt_trace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prompt_trace_postgres:
